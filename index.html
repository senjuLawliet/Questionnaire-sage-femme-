<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire Sage-femme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 30px; }
        .question-title { font-weight: bold; margin-bottom: 10px; }
        .form-check { margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5 shadow-sm">
    <h2 class="text-center">Questionnaire destiné aux sages-femmes</h2>
    
    <form>
        <div class="mb-4">
            <p class="question-title">1. Votre âge :</p>
            <input type="number" class="form-control" name="q1">
        </div>

        <div class="mb-4">
            <p class="question-title">2. Années d'expérience :</p>
            <input type="number" class="form-control" name="q2">
        </div>

        <div class="mb-4">
            <p class="question-title">5. Quel est votre lieu d'exercice actuel ?</p>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q5" id="q5_1" value="CHU">
                <label class="form-check-label" for="q5_1">CHU / EHS</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q5" id="q5_2" value="EPH">
                <label class="form-check-label" for="q5_2">EPH</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q5" id="q5_3" value="EPSP">
                <label class="form-check-label" for="q5_3">EPSP (Polyclinique / Salle d'accouchement)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q5" id="q5_4" value="Privé">
                <label class="form-check-label" for="q5_4">Secteur privé</label>
            </div>
            <div class="mt-2">
                <label class="form-label" for="q5_text">Si non, dites pourquoi :</label>
                <input type="text" class="form-control" name="q5_precision" id="q5_text">
            </div>
        </div>

        <div class="mb-4">
            <p class="question-title">12. Quelles sont les principales difficultés rencontrées ?</p>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="q12[]" id="q12_1" value="charge">
                <label class="form-check-label" for="q12_1">Charge de travail élevée</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="q12[]" id="q12_2" value="manque_moyens">
                <label class="form-check-label" for="q12_2">Manque de moyens matériels</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="q12[]" id="q12_3" value="formation">
                <label class="form-check-label" for="q12_3">Manque de formation continue</label>
            </div>
            <div class="mt-2">
                <label class="form-label" for="q12_text">Si non, dites les quelles:</label>
                <input type="text" class="form-control" name="q12_precision" id="q12_text">
            </div>
        </div>

        <div class="mb-4">
            <p class="question-title">13. Pensez-vous que cette approche est bénéfique ?</p>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q13" id="q13_yes" value="Oui">
                <label class="form-check-label" for="q13_yes">Oui</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="q13" id="q13_no" value="Non">
                <label class="form-check-label" for="q13_no">Non</label>
            </div>
            </div>

        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary btn-lg">Envoyer les réponses</button>
        </div>
    </form>
</div>

</body>
</html>
